<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuestLines GUI Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="header">
    <div id="header-logo">
      <span class="logo-ql">QL</span>
      <span class="logo-title">GUI Editor</span>
    </div>
    <div id="header-actions">
      <button class="hdr-btn" id="btn-new">New</button>
      <button class="hdr-btn" id="btn-import">Import HTML</button>
      <button class="hdr-btn" id="btn-export">Export HTML</button>
    </div>
  </div>

  <div id="main">

    <!-- LEFT: GUI settings + element tree -->
    <div id="left-sidebar">
      <div class="side-section-header">GUI Settings</div>
      <div id="gui-settings"></div>

      <div class="side-section-header" style="margin-top:0;">
        <span>Elements</span>
        <button class="small-add-btn" id="btn-add-root">+ Add</button>
      </div>
      <div id="element-tree"></div>
    </div>

    <!-- CENTER: Preview -->
    <div id="preview-area">
      <div id="preview-label">Preview</div>
    </div>

    <!-- RIGHT: Properties -->
    <div id="right-sidebar">
      <div class="side-section-header">Properties</div>
      <div id="props-panel"></div>
    </div>

  </div>

  <!-- JSON Modal -->
  <div id="json-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2 id="json-modal-title">JSON</h2>
      <textarea id="json-textarea" spellcheck="false" placeholder="Paste JSON here..."></textarea>
      <div class="modal-actions">
        <button class="modal-btn" id="json-modal-close">Cancel</button>
        <button class="modal-btn" id="json-modal-download" style="display:none;">Download File</button>
        <button class="modal-btn primary" id="json-modal-action">Import</button>
      </div>
    </div>
  </div>

  <!-- Add Element Modal -->
  <div id="add-modal" class="modal-overlay" style="display:none;">
    <div class="modal add-modal-inner">
      <h2>Add Element</h2>
      <p class="add-modal-hint" id="add-modal-hint"></p>
      <div class="add-palette">
        <button class="palette-btn" data-type="label">
          <span class="palette-icon">T</span>
          <span>Label</span>
        </button>
        <button class="palette-btn" data-type="button">
          <span class="palette-icon">▶</span>
          <span>Button</span>
        </button>
        <button class="palette-btn" data-type="spacer">
          <span class="palette-icon">⇕</span>
          <span>Spacer</span>
        </button>
        <button class="palette-btn" data-type="divider">
          <span class="palette-icon">─</span>
          <span>Divider</span>
        </button>
        <button class="palette-btn" data-type="panel">
          <span class="palette-icon">▣</span>
          <span>Panel</span>
        </button>
        <button class="palette-btn" data-type="image">
          <span class="palette-icon">🖼</span>
          <span>Image</span>
        </button>
        <button class="palette-btn" data-type="itemicon">
          <span class="palette-icon">◈</span>
          <span>Item Icon</span>
        </button>
        <button class="palette-btn" data-type="itemgrid">
          <span class="palette-icon">⊞</span>
          <span>Item Grid</span>
        </button>
        <button class="palette-btn" data-type="progressbar">
          <span class="palette-icon">▬</span>
          <span>Progress Bar</span>
        </button>
        <button class="palette-btn" data-type="hyvatar">
          <span class="palette-icon">👤</span>
          <span>Hyvatar</span>
        </button>
        <button class="palette-btn" data-type="checkbox">
          <span class="palette-icon">☑</span>
          <span>Checkbox</span>
        </button>
        <button class="palette-btn" data-type="dropdown">
          <span class="palette-icon">▾</span>
          <span>Dropdown</span>
        </button>
        <button class="palette-btn" data-type="sprite">
          <span class="palette-icon">✦</span>
          <span>Sprite</span>
        </button>
        <button class="palette-btn" data-type="hotkeylabel">
          <span class="palette-icon">⌨</span>
          <span>Hotkey Label</span>
        </button>
      </div>
      <div class="modal-actions">
        <button class="modal-btn" id="add-modal-close">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
